<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxo - Admin</title>
    <link rel="shortcut icon" href="images/barco2.png" type="image/x-icon" />
    <link rel="stylesheet" href="css/default.css" />
  </head>

  <body>
    <div class="page">
    <header>
      <div id="title">
        <img src="images/barco1.png" alt="ícone de barco" />
        <div class="headtitle">
          <h1>Luxo</h1>
          <h2>Aluguel de iates</h2>
        </div>
      </div>

      <nav>
        <ul class="navmenu">
          <li><a href="index.html">Página inicial</a></li>
          <li><a href="aluguel.html">Aluguel de iates</a></li>
          <li><a href="destinos.html">Destinos</a></li>
          <li><a href="admin.html" class="accent">Admin</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="pagtitle">
        <div class="bgtitle"></div>
        <h2>Área Administrativa</h2>
      </div>

      <form id="formLogin">
        <div class="entry">
          <label for="adminEmail">E-mail</label>
          <input type="email" id="adminEmail" required />
        </div>

        <div class="entry">
          <label for="adminSenha">Senha</label>
          <input type="password" id="adminSenha" required />
        </div>
      </form>

      <div class="buttons">
        <button type="button" id="btnEntrar" class="button">Entrar</button>
      </div>
    </main>
    </div>

    <footer>
      <p>© 2023 por Luxo aluguel de iates</p>
    </footer>

    <script src="js/jquery-3.6.4.min.js"></script>
    <script src="js/api.js"></script>

    <script>
      $(document).ready(function () {
        $("#btnEntrar").click(function () {
          var emailLog = $("#adminEmail").val();
          var senhaLog = $("#adminSenha").val();

          var objLoginSenha = {
            email: emailLog,
            senha: senhaLog
          };

          var usuarioValido = validarUsuario(objLoginSenha);

          if (usuarioValido) {
            window.location.href = "mensagens.html";
          } else {
            alert("E-mail e Senha inválidos");
          }
        });
      });
    </script>
  </body>
</html>
